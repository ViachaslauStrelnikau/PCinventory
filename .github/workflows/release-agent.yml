name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'contracts/**'
      - '.github/workflows/release-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify InventoryAgent.exe
        shell: pwsh
        env:
          PCINVENTORY_FIREBASE_PROJECT_ID: ${{ secrets.PCINVENTORY_FIREBASE_PROJECT_ID }}
          PCINVENTORY_FIREBASE_API_KEY: ${{ secrets.PCINVENTORY_FIREBASE_API_KEY }}
          PCINVENTORY_COLLECTOR_EMAIL: ${{ secrets.PCINVENTORY_COLLECTOR_EMAIL }}
          PCINVENTORY_COLLECTOR_PASSWORD: ${{ secrets.PCINVENTORY_COLLECTOR_PASSWORD }}
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          ./agent/packaging/build-windows-poc.ps1 -SevenZip $sevenZip

          $exe = 'agent/target/windows/InventoryAgent.exe'
          & $sevenZip t $exe
          if ($LASTEXITCODE -ne 0) { throw 'EXE payload verification failed' }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath "$exe.sha256" -Raw).Trim()
          if ($checksum -ne "$hash  InventoryAgent.exe") { throw 'EXE checksum mismatch' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: InventoryAgent-windows-x86
          path: |
            agent/target/windows/InventoryAgent.exe
            agent/target/windows/InventoryAgent.exe.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified Windows build
        uses: actions/download-artifact@v8
        with:
          name: InventoryAgent-windows-x86
          path: dist

      - name: Publish Windows prerelease
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tr -d '\r' < InventoryAgent.exe.sha256 | sha256sum --check --strict

          build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          {
            printf '%s\n\n' 'Испытательная сборка PCinventory для Windows.'
            printf '%s\n\n' 'Скачайте InventoryAgent.exe и запустите его. Java 8 x86 уже включена в EXE.'
            printf '[Сборка GitHub Actions](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release-notes.md

          gh release create "windows-build-$build" InventoryAgent.exe InventoryAgent.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PCinventory Windows build $build" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
